name: ${OCEAN_DATA_WORKSHOP_PROJECT:-ocean-data-workshop}

services:
  db:
    image: timescale/timescaledb:2.30.1-pg17
    # NO `container_name:` here, deliberately.
    #
    # A hardcoded container name means two checkouts of this repo on one machine
    # collide, even on different host ports -- and the error is a wall of Docker text
    # ending in "Conflict. The container name is already in use". Found by cloning the
    # repo to a second directory during a from-scratch setup test, which is the exact
    # thing an attendee does when they want to try it without touching their real
    # checkout. Letting compose derive the name from the project keeps two checkouts
    # independent. Everything that needs the container goes through `docker compose
    # exec`, which resolves it.
    ports:
      - "${OCEAN_DATA_WORKSHOP_PORT:-5432}:5432"
    environment:
      POSTGRES_PASSWORD: ocean      # local workshop only, never a real secret
      POSTGRES_DB: ocean_data_workshop
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ocean_data_workshop"]
      interval: 3s
      timeout: 3s
      retries: 15
    volumes:
      - timescale_data:/var/lib/postgresql/data

volumes:
  timescale_data:
