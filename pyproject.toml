[project]
name = "ocean-data-workshop"
version = "0.1.0"
description = "A hands-on workshop on retrieving real ocean data from public APIs, and on the traps in doing so."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = ["oceanography", "data-access", "teaching", "notebooks", "copernicus", "erddap"]
classifiers = [
  "Intended Audience :: Education",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
  "Topic :: Education",
]
dependencies = [
    "cmocean>=4.0.3",
    "copernicusmarine>=2.5.0",
    "duckdb>=1.1.0",
    "gsw>=3.6.23",
    "h5netcdf>=1.8.1",
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.4",
    "matplotlib>=3.11.2",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "netcdf4>=1.7.4",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "psycopg[binary]>=3.3.6",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "xarray>=2026.7.0",
]

[project.optional-dependencies]
# Optional, not a default dependency. Notebook 10 is the last of twenty-six and is
# explicitly a bonus: torch is a ~200 MB download that nobody should wait through before
# starting, and notebooks 02 and 07 cover the same classification and clustering
# problems with scikit-learn. Declared here rather than left undeclared so that
# `uv sync --extra bonus` resolves, and so the notebook's "not installed" message can
# point at a command that actually works.
bonus = [
    "torch>=2.9.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 90
target-version = "py312"
# Notebooks are not linted. They import mid-file by design (path setup, then helpers),
# and linting the .ipynb adds noise without adding confidence -- the build already
# fails on any unhandled error when it executes them.
extend-exclude = ["*.ipynb"]

[project.scripts]
# Cross-platform entry points. `uv run workshop-setup` is the same on macOS, Linux and
# Windows, which is why setup is Python and not a .sh plus a .bat that drift apart.
workshop-setup = "ocean_data_workshop.workshop_setup:main"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "RUF"]
# PERF102/SIM117 are micro-optimisations that make probe code harder to read for no
# measurable gain -- a probe runs a handful of times, not in a hot loop.
ignore = [
  "E501",
  # RUF001: figure labels use real math notation (x, minus) on purpose
  "RUF001",
]

[tool.ruff.lint.per-file-ignores]
# probes deliberately catch broad exceptions: a failed probe IS the data
"probes/*" = ["BLE001"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ocean_data_workshop"]
